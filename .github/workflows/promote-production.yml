# Every push to `staging` runs the site rules and a smoke test against the
# Netlify staging deploy, then waits for a human to approve the "production"
# environment in GitHub. Only after that click is `main` fast-forwarded to the
# exact commit that passed. Same process as the Revelance site.
#
# Setup (once): repo Settings -> Environments -> "production" with you as a
# required reviewer, and a repo variable STAGING_URL (e.g.
# https://e9design-staging.netlify.app).
name: Promote staging to production

on:
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: promote-production
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
      pending: ${{ steps.meta.outputs.pending }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0

      - name: Site rules
        run: python3 .github/scripts/site_rules.py

      - name: Work out what would go live
        id: meta
        run: |
          set -e
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if ! git fetch -q origin main 2>/dev/null; then
            echo "no main branch yet; first promotion"
            echo "pending=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$(git rev-parse origin/main)" = "$sha" ]; then
            echo "main already matches staging; nothing to promote"
            echo "pending=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git merge-base --is-ancestor origin/main "$sha" \
            || { echo "staging is not a fast-forward of main; resolve by hand"; exit 1; }
          echo "pending=true" >> "$GITHUB_OUTPUT"
          { echo "### Files that will go live on approval"; echo;
            git diff --name-only origin/main "$sha" | sed 's/^/- /'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke-test the staging site
        if: steps.meta.outputs.pending == 'true' && vars.STAGING_URL != ''
        env:
          S: ${{ vars.STAGING_URL }}
        run: |
          set -e
          sleep 60   # give Netlify time to publish this commit
          for p in / /simulators/ /how-it-works/ /showroom/ /contact/; do
            code=$(curl -s -o /tmp/p.html -w '%{http_code}' "$S$p")
            [ "$code" = "200" ] || { echo "QA FAIL: $p returned $code"; exit 1; }
            grep -q '</html>' /tmp/p.html || { echo "QA FAIL: $p truncated"; exit 1; }
          done
          echo "QA PASS"

  # Refuse to promote unless "production" exists AND requires a reviewer.
  # (A job that names a missing environment would silently create it with no
  # protection, so this check runs first, outside the environment.)
  environment-guard:
    needs: qa
    if: needs.qa.outputs.pending == 'true'
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          r=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/environments/production") \
            || { echo "The 'production' environment does not exist yet; refusing to promote."; exit 1; }
          echo "$r" | python3 -c 'import json,sys; e=json.load(sys.stdin); ok=any(p.get("type")=="required_reviewers" and p.get("reviewers") for p in e.get("protection_rules",[])); sys.exit(0 if ok else 1)' \
            || { echo "'production' has no required reviewers; refusing to promote."; exit 1; }
          echo "production requires reviewer approval"

  promote:
    needs: [qa, environment-guard]
    if: needs.qa.outputs.pending == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://e9design.net
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.qa.outputs.sha }}
          fetch-depth: 0
      - name: Fast-forward main to the approved commit
        run: git push origin "${{ needs.qa.outputs.sha }}:refs/heads/main"
